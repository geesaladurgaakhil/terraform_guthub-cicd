name: Infra Provisioning (Terraform + Bicep)

on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write   # required for OIDC login to Azure — no client secrets stored
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.5"
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  azlogin:
    name: azure login
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: azlist
        run: az group list
